
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>随机键帽标签页</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
      background: #f7f7f7;
    }

    img {
      width: 100%;
      max-width: 300px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    #tag {
      font-size: 16px;
      max-width: 90%;
      margin: 0 auto 20px;
      color: #333;
      line-height: 1.5;
      white-space: pre-line;
    }

    button {
      background-color: #ff2442;
      color: white;
      font-size: 18px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 80%;
      max-width: 300px;
    }

    #msg {
      margin-top: 12px;
      color: green;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <h2>🧠 一键复制标签，轻松发小红书</h2>
  <img id="main-image" src="" alt="键帽图" />
  <div id="tag">加载中...</div>
  <button id="copy-btn">📋 复制标签</button>
  <div id="msg"></div>

  <script>
    const images = ["img1.jpg", "img2.jpg", "img3.jpg"];
    const tags = [
      "#键帽 #桌搭灵感 #打字也要美美的 #客制化键盘 #设计控",
      "#键帽 #极简风 #键盘改造 #细节美学 #好物分享",
      "#键帽 #键盘收藏 #桌搭神器 #外设推荐 #颜值设备"
    ];
    const idx = Math.floor(Math.random() * images.length);
    document.getElementById("main-image").src = images[idx] + "?t=" + new Date().getTime();
    document.getElementById("tag").innerText = tags[idx];

    document.getElementById("copy-btn").addEventListener("click", function () {
      navigator.clipboard.writeText(tags[idx]).then(() => {
        document.getElementById("msg").innerText = "✅ 标签已复制，快去小红书粘贴发布吧！";
      });
    });
  </script>
</body>
</html>
